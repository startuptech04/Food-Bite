name: kitchen
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  shared_preferences: ^2.5.4
  flutter_skeleton_ui: ^0.0.6
  connectivity_plus: ^7.0.0
  image_picker: ^1.2.1
  formz: ^0.8.0
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3
  dio: ^5.9.2
  http_parser: ^4.1.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  otp_text_field: ^1.1.3
  flutter_widget_from_html: ^0.17.1
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  firebase_auth: ^6.2.0
  just_audio: ^0.10.5
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5
  timeago: ^3.7.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_local_notifications: ^21.0.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/other/
    - assets/images/tabs/
    - assets/images/error/
    - assets/images/languages/
    - assets/jsons/
    - assets/sounds/

  fonts:
    - family: bold
      fonts:
        - asset: assets/fonts/bold.ttf

    - family: semibold
      fonts:
        - asset: assets/fonts/semibold.ttf

    - family: regular
      fonts:
        - asset: assets/fonts/regular.ttf

    - family: medium
      fonts:
        - asset: assets/fonts/medium.ttf
